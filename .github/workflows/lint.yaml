name: CI
"on":
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: bash .github/scripts/ci-setup.bash
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bash .github/scripts/lint.bash
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: bash .github/scripts/build.bash

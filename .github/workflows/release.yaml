---
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release
run-name: >-
  ${{ inputs.version && format('v{0}', inputs.version) || 'Build' }}
"on":
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g., 1.2.0). Leave empty for build only.
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: >-
      ${{ inputs.version && format('v{0}', inputs.version) || 'Build' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-setup.bash
      - name: Lint
        run: bash .github/scripts/lint.bash
      - name: Version
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/version.bash "${VERSION}"
      - name: Build
        run: bash .github/scripts/build.bash
      - name: Release
        if: inputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release.bash "${VERSION}"
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ovc-linux-x86_64
          path: ovc-linux-x86_64
      - name: Upload Checksum Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ovc-linux-x86_64.sha256
          path: ovc-linux-x86_64.sha256

[package]
name = "ovc"
version = "1.7.0"
edition = "2024"
rust-version = "1.99.1"
description = "CLI application to manage OpenShift client versions"
license = "AGPL-3.0-or-later"
repository = "https://github.com/t-c-l-o-u-d/ovc"
keywords = ["openshift", "cli", "version-manager", "oc"]
categories = ["command-line-utilities"]

[[bin]]
name = "ovc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "color", "help", "usage", "error-context"] }
clap_complete = "4.6.11"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "http2"] }
tar = "0.4.46"
flate2 = "1.1.10"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"

[build-dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "color", "help", "usage", "error-context"] }
clap_mangen = "0.3.3"

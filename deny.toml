# SPDX-License-Identifier: AGPL-3.0-or-later

[advisories]
# Match strictness of dropped cargo-audit
yanked = "deny"
unsound = "all"

[licenses]
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
# clap_derive pulls syn 3, openssl-macros syn 2
skip = [{ crate = "syn" }]
